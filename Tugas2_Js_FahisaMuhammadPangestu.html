<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - Data Gaji Pegawai</title>
    <style>
        body { 
          font-family: sans-serif; 
          padding: 20px; 
        }

        table { 
          width: 100%; 
          border-collapse: collapse; 
          margin-top: 20px; 
        }

        th, td { 
          border: 1px solid #999; 
          padding: 10px; 
          text-align: left; 
        }

        th { 
          background-color: #f2f2f2; 
        }

        tfoot { 
          font-weight: bold; 
          background-color: #eee; 
        }
    </style>
</head>
<body>

    <h2>Data Rincian Gaji Pegawai</h2>
    <div id="tabel-kontainer"></div>

    <script>
        //deklarasi
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        //kondisional gaji
        let gapok = 0;
        if (jabatan === "Manajer") {
            gapok = 15000000;
        } else if (jabatan === "Asisten Manajer") {
            gapok = 10000000;
        } else if (jabatan === "Staff") {
            gapok = 5000000;
        }

        //Perhitungan Tunjangan & Potongan
        let tunjanganJabatan = 0.15 * gapok;

        //BPJS: 10% dari gaji pokok
        let bpjs = 0.1 * gapok;

        // Tunjangan Keluarga (Ternary)
        // Jika udah nikah dapat 20%, jika tidak dapat 0
        let tunjanganKeluarga = (status === "Menikah") ? (0.2 * gapok) : 0;

        // Total Gaji: Penjumlahan seluruh gaji
        // (Gapok + Tunjangan Jabatan + Tunjangan Keluarga) - BPJS
        let totalGaji = gapok + tunjanganJabatan + tunjanganKeluarga + bpjs;

        // --- 4. Mencetak Data ke Tabel HTML ---
        let cetak = `
            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan</th>
                        <th>Tunjangan Keluarga</th>
                        <th>BPJS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${nama}</td>
                        <td>${umur} Tahun</td>
                        <td>${jabatan}</td>
                        <td>${status}</td>
                        <td>Rp ${gapok.toLocaleString('id-ID')}</td>
                        <td>Rp ${tunjanganJabatan.toLocaleString('id-ID')}</td>
                        <td>Rp ${tunjanganKeluarga.toLocaleString('id-ID')}</td>
                        <td>Rp ${bpjs.toLocaleString('id-ID')}</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>Total Gaji Gross:</td>
                        <td colspan="7" style="text-align:center">Rp ${totalGaji.toLocaleString('id-ID')}</td>
                    </tr>
                </tfoot>
            </table>
        `;

        // Masukkan string tabel ke dalam div kontainer
        document.getElementById('tabel-kontainer').innerHTML = cetak;

    </script>
</body>
</html>
